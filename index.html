<style>
:root{--bg:#f5f7f2;--card:#fff;--muted:#5b6b60;--line:#d7ded0;--text:#12201a;--green:#166534;--green2:#22c55e;--gold:#92400e;--red:#b91c1c;--blue:#1d4ed8;--r:14px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,rgba(34,197,94,.08),transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh}.top{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:14px}.btn{border:1px solid var(--line);background:#eef1ea;color:var(--text);border-radius:10px;padding:9px 13px;font-weight:700}.primary{background:linear-gradient(160deg,var(--green2),#16a34a);border:0;color:#03130a}.danger{background:#fff0f0;color:var(--red);border-color:#efb5b5}.wide{width:100%;display:block}.hero{text-align:center;padding:38px 18px 24px}.cup{font-size:46px}.hero h1{font-size:32px;margin:8px 0}.hero p{color:var(--muted);line-height:1.55;margin:0 auto 24px;max-width:470px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}.title{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);margin-bottom:10px}.view{padding:16px 18px 80px}.name{font-size:27px;font-weight:900;letter-spacing:.01em;margin-bottom:4px}.desc{color:var(--muted);font-size:13px;margin-bottom:12px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#eef1ea;font-size:11px;font-weight:800}.live{color:var(--green);border-color:#9bd1ae}.gold{color:var(--gold);border-color:#e5c58b}.red{color:var(--red);border-color:#efb5b5}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;position:sticky;top:0;z-index:10;background:rgba(245,247,242,.94);backdrop-filter:blur(8px);padding:8px 10px;border-bottom:1px solid var(--line);overflow:hidden}.tab{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 4px;border-radius:10px;font-weight:700;font-size:13px}.tab.active{background:#eef1ea;border-color:var(--line);color:var(--green)}.section{font-size:18px;font-weight:900;margin:22px 0 9px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0;font-size:12px}th:first-child,td:first-child{width:6%}th:nth-child(2),td:nth-child(2){width:28%;text-align:left}th:nth-child(n+3),td:nth-child(n+3){width:8%}td:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{font-size:10px;color:var(--muted);padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}td:nth-child(2){font-weight:700}.qual{box-shadow:inset 3px 0 var(--green)}.elim{opacity:.55}.pts{color:var(--green);font-weight:900}.fixture{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.team{flex:1;font-weight:700}.right{text-align:right}.score{font-weight:900;font-size:17px;min-width:64px;text-align:center}.small{font-size:11px;color:var(--muted)}.bracket{display:flex;gap:20px;overflow:auto;padding:5px 2px 15px}.col{min-width:190px}.col h4{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase}.bm{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin:25px 0}.bmrow{display:flex;justify-content:space-between;padding:4px 0;font-weight:700}.win{color:var(--green)}.form label{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;margin:13px 0 6px}.form input,.form textarea{width:100%;border:1px solid var(--line);background:#eef1ea;border-radius:10px;padding:12px}.players{display:grid;gap:8px}.empty{text-align:center;color:var(--muted);padding:38px 12px}.modalbg{position:fixed;inset:0;background:rgba(4,8,6,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.scoreinputs{display:flex;align-items:end;gap:14px;margin:20px 0}.scoreinputs>div{flex:1;text-align:center}.scoreinputs input{width:82px;height:66px;text-align:center;font-size:30px;font-weight:900}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green2);color:#04140b;padding:11px 18px;border-radius:999px;font-weight:800;z-index:100}.notice{background:#fff9e8;border:1px solid #ead49c;border-radius:10px;padding:10px;font-size:12px;color:var(--gold)}@media(max-width:559px){table{font-size:11px}th,td{padding:8px 2px}.tablewrap{overflow-x:hidden}th:nth-child(2),td:nth-child(2){padding-left:4px;padding-right:4px}.tabs{padding-left:6px;padding-right:6px}.tab{font-size:11px;padding-left:2px;padding-right:2px}}@media(min-width:560px){.modalbg{align-items:center}.modal{border-radius:18px}}
</style>
</head><body><main class="app" id="app"></main>
<script>
const CONFIG=window.TOURNAMENT_CONFIG||{SUPABASE_URL:'https://vtsplizhadfyrdykusbr.supabase.co',SUPABASE_KEY:'sb_publishable_0zRkZmDcno3w3fzRJc_ILQ_yms5iunb'};
const db=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
const state={view:'home',tab:'overview',code:null,t:null,admin:false,myName:localStorage.getItem('ef_name')||'',poll:null,channel:null};
const app=document.getElementById('app');
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(); const code=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join('');
function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function modal(html){closeModal();const d=document.createElement('div');d.className='modalbg';d.id='modal';d.innerHTML='<div class="modal">'+html+'</div>';d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)} function closeModal(){document.getElementById('modal')?.remove()}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function groupFixtures(g,ids){const [a,b,c,d]=ids;return[[a,b],[c,d],[a,c],[d,b],[a,d],[b,c]].map((x,i)=>({id:uid(),stage:'group',group_name:g,matchday:Math.floor(i/2)+1,round:null,slot:null,home_id:x[0],away_id:x[1]}))}
function standings(t,g){const ps=t.participants.filter(p=>p.group_name===g), s=Object.fromEntries(ps.map(p=>[p.id,{id:p.id,name:p.name,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}]));t.matches.filter(m=>m.stage==='group'&&m.group_name===g&&m.status==='completed').forEach(m=>{let h=s[m.home_id],a=s[m.away_id];if(!h||!a)return;h.p++;a.p++;h.gf+=m.home_score;h.ga+=m.away_score;a.gf+=m.away_score;a.ga+=m.home_score;if(m.home_score>m.away_score){h.w++;a.l++;h.pts+=3}else if(m.home_score<m.away_score){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}});Object.values(s).forEach(x=>x.gd=x.gf-x.ga);return Object.values(s).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name))}
function groupDone(t){return t.matches.filter(m=>m.stage==='group').length===12&&t.matches.filter(m=>m.stage==='group').every(m=>m.status==='completed')}
async function fetchTournament(c){const {data:t,error:e}=await db.from('tournaments').select('id,code,name,description,status,created_at,started_at,completed_at,champion_id,updated_at').eq('code',c).single();if(e||!t)return null;const [pr,mr]=await Promise.all([db.from('participants').select('*').eq('tournament_id',t.id).order('created_at'),db.from('matches').select('*').eq('tournament_id',t.id).order('stage').order('matchday').order('slot')]);if(pr.error||mr.error)return null;t.participants=pr.data||[];t.matches=mr.data||[];return t}
async function createTournament(name,desc,names,groups){const c=code(),admin=uid();const parts=names.map((n,i)=>({id:uid(),name:n,group_name:groups[names[i]],player_token:uid()}));const {data,error}=await db.rpc('create_tournament',{p_code:c,p_name:name,p_description:desc||'',p_admin_token:admin,p_participants:parts.map(p=>({id:p.id,name:p.name,group:p.group_name,playerToken:p.player_token})),p_matches:[]});if(error){toast(error.message);return}state.code=c;localStorage.setItem('ef_admin_'+c,admin);await refresh();await ensureFixtures();await refresh();history.replaceState({},'',location.pathname+'?t='+c);state.view='tournament';render();toast('Tournament created!')}
async function ensureFixtures(){const t=state.t;if(!t||!t.participants.some(p=>p.group_name))return;const A=t.participants.filter(p=>p.group_name==='A').map(p=>p.id),B=t.participants.filter(p=>p.group_name==='B').map(p=>p.id);const matches=groupFixtures('A',A).concat(groupFixtures('B',B));const admin=localStorage.getItem('ef_admin_'+t.code);await db.rpc('admin_create_matches',{p_admin_token:admin,p_tournament_id:t.id,p_matches:matches})}
async function refresh(){if(!state.code)return;const t=await fetchTournament(state.code);if(!t){toast('Tournament not found');return}state.t=t}
function stopLive(){if(state.poll)clearInterval(state.poll);state.poll=null;if(state.channel){db.removeChannel(state.channel);state.channel=null}}
function startLive(){stopLive();if(!state.t)return;state.channel=db.channel('tournament-'+state.t.id).on('postgres_changes',{event:'*',schema:'public',table:'matches',filter:'tournament_id=eq.'+state.t.id},async()=>{await refresh();render()}).subscribe();state.poll=setInterval(async()=>{await refresh();render()},5000)}
async function home(){stopLive();state.view='home';state.code=null;state.t=null;render()}
function render(){if(state.view==='home')return renderHome();if(state.view==='create')return renderCreate();renderTournament()}
function renderHome(){app.innerHTML='<div class="hero"><div class="cup">🏆</div><h1>Friday Night Cup</h1><p>Friendly 8-player eFootball tournament manager. Create a cup, share the link, and let everyone keep the scores updated.</p><button class="btn primary wide" onclick="state.view=\'create\';render()">Create Tournament</button><div class="card" style="margin-top:14px"><div class="title">Join Tournament</div><div class="form"><label>Tournament code</label><input id="joinCode" placeholder="e.g. A7K92P" maxlength="6" style="text-transform:uppercase"><button class="btn wide" style="margin-top:10px" onclick="joinTournament()">Join</button></div></div></div>'}
function renderCreate(){const names=state.draftNames||Array(8).fill('');app.innerHTML='<div class="top"><div class="brand">New Tournament</div><button class="btn" onclick="home()">Cancel</button></div><div class="view"><div class="section">Tournament details</div><div class="card form"><label>Name</label><input id="tname" value="Friday Night Cup"><label>Description</label><textarea id="tdesc" rows="2" placeholder="Friendly eFootball tournament"></textarea></div><div class="section">8 players</div><div class="card form players">'+names.map((n,i)=>'<div><label>Player '+(i+1)+'</label><input class="pname" value="'+esc(n)+'" placeholder="Team / player name"></div>').join('')+'</div><button class="btn primary wide" onclick="createFromForm()">Randomize groups & create</button></div>'}
async function createFromForm(){const names=[...document.querySelectorAll('.pname')].map(x=>x.value.trim());if(names.length!==8||names.some(Boolean)===false||names.some(n=>!n)||new Set(names.map(n=>n.toLowerCase())).size!==8){toast('Enter 8 unique player names');return}const sh=shuffle(names),groups={};sh.forEach((n,i)=>groups[n]=i<4?'A':'B');state.draftNames=names;await createTournament(document.getElementById('tname').value.trim()||'Friday Night Cup',document.getElementById('tdesc').value.trim(),names,groups)}
async function joinTournament(){const c=(document.getElementById('joinCode').value||'').trim().toUpperCase();if(c.length!==6){toast('Enter a 6-character code');return}state.code=c;await refresh();if(!state.t){state.code=null;return}state.view='tournament';state.tab='overview';render();startLive()}
function renderTournament(){const t=state.t;if(!t)return home();state.admin=!!localStorage.getItem('ef_admin_'+t.code);const done=t.matches.filter(m=>m.status==='completed').length;const total=t.matches.length;const tabs=['overview','groups','fixtures','knockout','leaderboard'];app.innerHTML='<div class="top"><div><div class="brand">🏆 '+esc(t.name)+'</div><div class="small">Code: '+esc(t.code)+'</div></div><button class="btn" onclick="shareTournament()">Share</button></div><div class="tabs">'+tabs.map(x=>'<button class="tab '+(state.tab===x?'active':'')+'" onclick="state.tab=\''+x+'\';render()">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div><div class="view">'+renderTab(t,done,total)+'</div>'}
function renderTab(t,done,total){if(state.tab==='groups')return renderGroups(t);if(state.tab==='fixtures')return renderFixtures(t);if(state.tab==='knockout')return renderKnockout(t);if(state.tab==='leaderboard')return renderLeaderboard(t);return renderOverview(t,done,total)}
function renderOverview(t,done,total){const A=standings(t,'A'),B=standings(t,'B');let next=t.matches.find(m=>m.status==='scheduled');const pname=id=>t.participants.find(p=>p.id===id)?.name||'TBD';return '<div class="name">'+esc(t.name)+'</div><div class="desc">'+esc(t.description||'Friendly eFootball tournament')+'</div><div class="badges"><span class="badge live">'+esc(t.status.replace('_',' '))+'</span><span class="badge">'+done+'/'+total+' matches</span></div><div class="section">Current standings</div>'+standMini('A',A)+standMini('B',B)+'<div class="section">Next match</div><div class="card">'+(next?'<b>'+esc(pname(next.home_id))+'</b> vs <b>'+esc(pname(next.away_id))+'</b><div class="small" style="margin-top:5px">Matchday '+next.matchday+'</div>':'<div class="empty">No upcoming matches.</div>')+'</div>'+(state.admin?'<div class="card notice"><b>Organizer mode</b><br>Admin controls are available from individual match actions.</div>':'')}
function standMini(g,s){return '<div class="card"><div class="title">Group '+g+'</div><div class="tablewrap"><table><tr><th>#</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr>'+s.map((x,i)=>'<tr class="'+(i<2?'qual':'elim')+'"><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.p+'</td><td>'+signed(x.gd)+'</td><td class="pts">'+x.pts+'</td></tr>').join('')+'</table></div></div>'}
function signed(x){return x>0?'+'+x:x}
function renderGroups(t){return '<div class="section">Group stage</div>'+['A','B'].map(g=>{const s=standings(t,g);return '<div class="card"><div class="title">Group '+g+'</div><div class="tablewrap"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>'+s.map((x,i)=>'<tr class="'+(i<2?'qual':'elim')+'"><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+x.gf+'</td><td>'+x.ga+'</td><td>'+signed(x.gd)+'</td><td class="pts">'+x.pts+'</td></tr>').join('')+'</table></div></div>'}).join('')+'<div class="small">Tiebreakers: points → goal difference → goals scored → alphabetical fallback.</div>'}
function renderFixtures(t){const pname=id=>t.participants.find(p=>p.id===id)?.name||'TBD';return '<div class="section">Fixtures</div>'+['A','B'].map(g=>'<div class="card"><div class="title">Group '+g+'</div>'+t.matches.filter(m=>m.stage==='group'&&m.group_name===g).map(m=>fixtureHTML(m,pname)).join('')+'</div>').join('')}
function fixtureHTML(m,pname){return '<div class="fixture"><div class="team">'+esc(pname(m.home_id))+'</div><div class="score">'+(m.status==='completed'?m.home_score+' – '+m.away_score:'vs')+'<div class="small">'+(m.status==='completed'?'Completed':'MD '+m.matchday)+'</div></div><div class="team right">'+esc(pname(m.away_id))+'</div><button class="btn" onclick="openResult(\''+m.id+'\')">'+(m.status==='completed'?'View':'Score')+'</button></div>'}
function renderKnockout(t){const ms=t.matches.filter(m=>m.stage==='knockout'),p=id=>t.participants.find(x=>x.id===id)?.name||'TBD';if(!ms.length)return '<div class="empty">The knockout bracket will appear after all 12 group matches are completed.</div>';return '<div class="section">Knockout</div><div class="bracket"><div class="col"><h4>Semi-finals</h4>'+ms.filter(m=>m.round==='semi').sort((a,b)=>a.slot-b.slot).map(m=>knockMatch(m,p)).join('')+'</div><div class="col"><h4>Final / 3rd place</h4>'+ms.filter(m=>m.round==='final'||m.round==='third').sort((a,b)=>a.round.localeCompare(b.round)).map(m=>knockMatch(m,p)).join('')+'</div></div>'}
function knockMatch(m,p){return '<div class="bm"><div class="bmrow"><span>'+esc(p(m.home_id))+'</span><span>'+(m.home_score??'—')+'</span></div><div class="bmrow"><span>'+esc(p(m.away_id))+'</span><span>'+(m.away_score??'—')+'</span></div><div class="small">'+(m.status==='completed'?'Completed':'Upcoming')+'</div><button class="btn wide" style="margin-top:8px" onclick="openResult(\''+m.id+'\')">'+(m.status==='completed'?'View':'Enter result')+'</button></div>'}
function renderLeaderboard(t){const all=[...standings(t,'A'),...standings(t,'B')].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));return '<div class="section">Overall leaderboard</div><div class="card"><div class="tablewrap"><table><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+all.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+signed(x.gd)+'</td><td class="pts">'+x.pts+'</td></tr>').join('')+'</table></div></div>'}
async function openResult(id){const m=state.t.matches.find(x=>x.id===id);if(!m)return;const p=x=>state.t.participants.find(y=>y.id===x)?.name||'TBD';modal('<div class="modalhead"><h3>'+esc(p(m.home_id))+' vs '+esc(p(m.away_id))+'</h3><button class="btn" onclick="closeModal()">×</button></div><div class="scoreinputs"><div><div class="small">'+esc(p(m.home_id))+'</div><input id="hs" type="number" min="0" step="1" value="'+(m.home_score??0)+'"></div><strong>–</strong><div><div class="small">'+esc(p(m.away_id))+'</div><input id="as" type="number" min="0" step="1" value="'+(m.away_score??0)+'"></div></div><button class="btn primary wide" onclick="submitResult(\''+m.id+'\')">'+(m.status==='completed'?'Update result':'Submit result')+'</button>'+(m.status==='completed'&&state.admin?'<button class="btn danger wide" style="margin-top:8px" onclick="resetMatch(\''+m.id+'\')">Reset match</button>':'')+'</div>')}
async function submitResult(id){const h=Number(document.getElementById('hs').value),a=Number(document.getElementById('as').value);if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0){toast('Enter valid scores');return}const m=state.t.matches.find(x=>x.id===id),token=localStorage.getItem('ef_admin_'+state.t.code)||localStorage.getItem('ef_player_'+id)||state.myName||'guest';const {error}=await db.rpc('submit_match_result',{p_match_id:id,p_home_score:h,p_away_score:a,p_submitted_by:token,p_admin_token:state.admin?token:null});if(error){toast(error.message);return}closeModal();await refresh();render();toast('Result saved')}
async function resetMatch(id){const token=localStorage.getItem('ef_admin_'+state.t.code);if(!token){toast('Organizer access required');return}const {error}=await db.rpc('admin_reset_match',{p_admin_token:token,p_match_id:id});if(error){toast(error.message);return}closeModal();await refresh();render();toast('Match reset')}
async function shareTournament(){const url=location.href;try{await navigator.clipboard.writeText(url);toast('Tournament link copied!')}catch{prompt('Copy tournament link',url)}}
const params=new URLSearchParams(location.search);if(params.get('t')){state.code=params.get('t').toUpperCase();state.view='tournament';refresh().then(()=>{if(state.t){render();startLive()}else home()})}else render();
</script></body></html>
