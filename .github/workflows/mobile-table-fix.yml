name: Apply mobile table layout

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/mobile-table-fix.yml'

permissions:
  contents: write

jobs:
  fix-mobile-tables:
    if: "!contains(github.event.head_commit.message, '[auto-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          mobile_old = '@media(max-width:559px){table{font-size:11px}th,td{padding:8px 2px}.tablewrap{overflow-x:hidden}th:nth-child(2),td:nth-child(2){padding-left:4px;padding-right:4px}}'
          mobile_new = '@media(max-width:559px){table{font-size:11px}th,td{padding:8px 2px}.tablewrap{overflow-x:hidden}th:nth-child(2),td:nth-child(2){padding-left:4px;padding-right:4px}.fixture{width:100%}}'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)
          old = "function overview(t){return `<div class=\"card\"><div class=\"title\">Group stage progress</div><b>${t.matches.filter(m=>m.stage==='group'&&m.status==='completed').length} / 12</b> matches completed</div>${table(t,'A')}${table(t,'B')}<div class=\"section\">Recent results</div><div class=\"card\">${t.matches.filter(m=>m.status==='completed').slice(-3).reverse().map(m=>`<div style=\"padding:8px 0;border-bottom:1px solid var(--line)\">${esc(pname(m.home_id))} <b>${m.home_score}–${m.away_score}</b> ${esc(pname(m.away_id))}</div>`).join('')||'<span class=\"small\">No results yet.</span>'}</div>`}"
          new = "function overview(t){const upcoming=['A','B'].map(g=>{const ms=t.matches.filter(m=>m.stage==='group'&&m.group_name===g&&m.status!=='completed').slice(0,3);return `<div class=\"section\">Upcoming · Group ${g}</div>${ms.map(fixture).join('')||'<div class=\"card empty\">No upcoming matches in this group.</div>'}`}).join('');return `<div class=\"card\"><div class=\"title\">Group stage progress</div><b>${t.matches.filter(m=>m.stage==='group'&&m.status==='completed').length} / 12</b> matches completed</div>${table(t,'A')}${table(t,'B')}<div class=\"section\">Upcoming matches</div>${upcoming}<div class=\"section\">Recent results</div><div class=\"card\">${t.matches.filter(m=>m.status==='completed').slice(-3).reverse().map(m=>`<div style=\"padding:8px 0;border-bottom:1px solid var(--line)\">${esc(pname(m.home_id))} <b>${m.home_score}–${m.away_score}</b> ${esc(pname(m.away_id))}</div>`).join('')||'<span class=\"small\">No results yet.</span>'}</div>`}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show six upcoming matches on overview [auto-fix]'
          git push
