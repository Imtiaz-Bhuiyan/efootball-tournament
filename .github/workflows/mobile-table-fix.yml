# Responsive UI automation for the tournament app
name: Apply mobile table layout

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/mobile-table-fix.yml'

permissions:
  contents: write

jobs:
  fix-mobile-tables:
    if: "!contains(github.event.head_commit.message, '[auto-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply overview and responsive fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          mobile_old = '@media(max-width:559px){table{font-size:11px}th,td{padding:8px 2px}.tablewrap{overflow-x:hidden}th:nth-child(2),td:nth-child(2){padding-left:4px;padding-right:4px}}'
          mobile_new = '@media(max-width:559px){table{font-size:11px}th,td{padding:8px 2px}.tablewrap{overflow-x:hidden}th:nth-child(2),td:nth-child(2){padding-left:4px;padding-right:4px}.fixture{width:100%}}'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)

          ribbon_css = '.ribbon{overflow:hidden;border:1px solid var(--line);background:#12201a;color:#fff;border-radius:10px;margin-bottom:14px;white-space:nowrap}.ribbon-track{display:flex;width:max-content;animation:wclTicker 24s linear infinite;will-change:transform}.ribbon-set{display:flex;flex-shrink:0}.ribbon-item{display:inline-block;padding:9px 28px;font-size:12px;font-weight:700;flex-shrink:0}.ribbon-item b{color:#86efac;margin-right:5px}@keyframes wclTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}'
          if '.ribbon{' not in s:
              s = s.replace('</style>', ribbon_css + '</style>', 1)

          new_fn = '''function renderOverview(t,done,total){const A=standings(t,'A'),B=standings(t,'B');const pname=id=>t.participants.find(p=>p.id===id)?.name||'TBD';const completed=t.matches.filter(m=>m.status==='completed').sort((a,b)=>new Date(b.updated_at||b.submitted_at||0)-new Date(a.updated_at||a.submitted_at||0)).slice(0,2);const items=completed.length?completed.map(m=>'<span class="ribbon-item"><b>LATEST RESULT</b>'+esc(pname(m.home_id))+' '+m.home_score+' – '+m.away_score+' '+esc(pname(m.away_id))+'</span>').join(''):'<span class="ribbon-item"><b>LATEST RESULT</b>No match results yet.</span>';const ribbon='<div class="ribbon"><div class="ribbon-track"><div class="ribbon-set">'+items+'</div><div class="ribbon-set">'+items+'</div></div></div>';let upcoming;if(groupDone(t)){const ko=t.matches.filter(m=>m.stage==='knockout'&&m.status==='scheduled').sort((a,b)=>(a.slot??99)-(b.slot??99));upcoming=ko.length?'<div class="title" style="margin-top:14px">Knockout stage</div>'+ko.map(m=>fixtureHTML(m,pname)).join(''):'<div class="card empty">Knockout matches are being prepared.</div>'}else{upcoming=['A','B'].map(g=>{const ms=t.matches.filter(m=>m.stage==='group'&&m.group_name===g&&m.status==='scheduled').slice(0,3);return '<div class="title" style="margin-top:14px">Group '+g+'</div>'+(ms.map(m=>fixtureHTML(m,pname)).join('')||'<div class="card empty">No upcoming matches in this group.</div>')}).join('')}return ribbon+'<div class="name">'+esc(t.name)+'</div><div class="desc">'+esc(t.description||'Friendly eFootball tournament')+'</div><div class="badges"><span class="badge live">'+esc(t.status.replace('_',' '))+'</span><span class="badge">'+done+'/'+total+' matches</span></div><div class="section">Current standings</div>'+standMini('A',A)+standMini('B',B)+'<div class="section">Upcoming matches</div>'+upcoming+(state.admin?'<div class="card notice"><b>Organizer mode</b><br>Admin controls are available from individual match actions.</div>':'')}'''
          pattern = r'function renderOverview\(t,done,total\)\{.*?\}\nfunction standMini'
          replacement = new_fn + '\nfunction standMini'
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate renderOverview function')
          p.write_text(s2)
          PY
      - name: Validate generated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, flags=re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make latest result ticker seamless [auto-fix]'
          git push
